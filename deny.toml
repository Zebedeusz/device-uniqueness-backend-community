[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "GPL-3.0-only",
    # verifiable (git dep): ring-VRF personhood-proof verification.
    "GPL-3.0-or-later WITH Classpath-exception-2.0",
]

[sources]
unknown-git = "deny"
allow-git = ["https://github.com/paritytech/verifiable"]

[bans]
multiple-versions = "warn"

[advisories]
yanked = "deny"
