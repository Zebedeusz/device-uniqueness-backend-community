# Paseo Next v2 — the primary environment. All ten services.
#
# Secrets are vault references, resolved at apply time; the chart refuses any
# value that is not one. TODO: confirm the vault path with SRE — the legacy
# convention is kv/argo-cd/<app>/<env>.

global:
  envId: paseo-next-v2
  ingress:
    host: TODO.parity.io          # TODO: hostname from SRE
  env:
    PEOPLE_RPC_URL: wss://paseo-people-next-system-rpc.polkadot.io
    # Paseo's Asset Hub runs an older reserve_name than this backend encodes,
    # so the dotNS lane is OFF here and ASSET_HUB_RPC_URL is unused. Turning it
    # on without repointing People at PreviewNet would claim names on the wrong
    # chain — a global, unrecoverable claim.
    DOTNS_GATEWAY_ENABLED: "false"
    ASSET_HUB_RPC_URL: ""
    PEOPLE_NETWORK: paseo
    QUEUE_ENABLED: "false"
    ATTESTER_ACCOUNT: TODO
    JWT_ED25519_PUBLIC_KEY: TODO
  inviters:
    dim: TODO-dim-inviter-ss58
    invite: TODO-invite-inviter-ss58   # MUST differ from dim — separate nonce lanes

workloads:
  identity-api:
    env:
      AUTH_ENABLED: "false"

secrets:
  identity-api:
    IDENTITY_DATABASE_URL: ref+vault://kv/TODO/identity-backend-v2/paseo-next-v2#IDENTITY_DATABASE_URL
    JWT_ED25519_SECRET: ref+vault://kv/TODO/identity-backend-v2/paseo-next-v2#JWT_ED25519_SECRET
  identity-chain-writer:
    IDENTITY_DATABASE_URL: ref+vault://kv/TODO/identity-backend-v2/paseo-next-v2#IDENTITY_DATABASE_URL
    CHAIN_WRITER_SIGNER_SURI: ref+vault://kv/TODO/identity-backend-v2/paseo-next-v2#CHAIN_WRITER_SIGNER_SURI
  registration-queue:
    IDENTITY_DATABASE_URL: ref+vault://kv/TODO/identity-backend-v2/paseo-next-v2#IDENTITY_DATABASE_URL
  username-indexer:
    INDEXER_DATABASE_URL: ref+vault://kv/TODO/identity-backend-v2/paseo-next-v2#INDEXER_DATABASE_URL
  dim-tickets-api:
    DIM_TICKETS_DATABASE_URL: ref+vault://kv/TODO/identity-backend-v2/paseo-next-v2#DIM_DATABASE_URL
  dim-tickets-writer:
    DIM_TICKETS_DATABASE_URL: ref+vault://kv/TODO/identity-backend-v2/paseo-next-v2#DIM_DATABASE_URL
    INVITER_SIGNER_SURI: ref+vault://kv/TODO/identity-backend-v2/paseo-next-v2#DIM_INVITER_SIGNER_SURI
  invite-tickets-api:
    INVITE_TICKETS_DATABASE_URL: ref+vault://kv/TODO/identity-backend-v2/paseo-next-v2#INVITE_DATABASE_URL
  invite-tickets-pool:
    INVITE_TICKETS_DATABASE_URL: ref+vault://kv/TODO/identity-backend-v2/paseo-next-v2#INVITE_DATABASE_URL
    INVITER_SIGNER_SURI: ref+vault://kv/TODO/identity-backend-v2/paseo-next-v2#INVITE_INVITER_SIGNER_SURI
  turn-api:
    TURN_SECRET: ref+vault://kv/TODO/identity-backend-v2/paseo-next-v2#TURN_SECRET
