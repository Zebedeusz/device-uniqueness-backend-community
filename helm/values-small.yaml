# The SMALL topology — four workloads instead of eight.
#
# One `all-in-one` process serves all five HTTP surfaces on one port, with the
# route table compiled in; the three single-instance workers stay separate,
# because each owns a Postgres lease and a nonce lane.
#
# READ THIS BEFORE USING IT. The trade is not "fewer moving parts" — it is the
# secret compartmentalisation the standard topology enforces. In this shape ONE
# process holds, at once:
#
#   JWT_ED25519_SECRET            mint an access token for ANY subject
#   POC_HMAC_SECRET               forge proof-of-compute solutions
#   TURN_SECRET                   mint TURN relay credentials
#   all three *_DATABASE_URLs     full read/write on every database
#
# and reaches them from the same address space that serves the unauthenticated,
# public `GET /api/v1/usernames/search`. In the standard topology a bug on that
# path reaches a read-only projection and a verify-only public key. That is the
# whole difference; the code, the handlers and the dependencies are identical.
#
# Full reasoning: docs/architecture.md, "Deployment topologies".
#
# This is an EXAMPLE, not a deployed environment. `paseo-next-v2` and
# `previewnet` stay on the standard topology by contract — moving either is a
# security decision, not a configuration change.

global:
  envId: small

  # Required. Absent by default, so this topology cannot be inherited by copying
  # another values file: the chart refuses to render without it.
  allInOne:
    acknowledgedSecretUnion: true

  ingress:
    host: TODO.example.org
  env:
    PEOPLE_RPC_URL: wss://paseo-people-next-system-rpc.polkadot.io
    DOTNS_GATEWAY_ENABLED: "false"
    ASSET_HUB_RPC_URL: ""
    PEOPLE_NETWORK: paseo
    QUEUE_ENABLED: "false"
    ATTESTER_ACCOUNT: TODO
    JWT_ED25519_PUBLIC_KEY: TODO
  inviters:
    invite: TODO-invite-inviter-ss58   # owns its own nonce lane

workloads:
  # The merged HTTP tier.
  all-in-one:
    enabled: true

  # ...and the five per-service workloads OFF. The chart fails to render if any
  # of them is left enabled alongside the merged one: a mix would pay this
  # topology's secret union while still running the compartmentalised services.
  identity-api:
    enabled: false
  username-indexer:
    enabled: false
  invite-tickets-api:
    enabled: false
  turn-api:
    enabled: false
  notify-relay:
    enabled: false

  # The three workers are unchanged — they belong to BOTH topologies.

# The merged process file-serves the committed API reference itself (the same
# artifact, from GATEWAY_DOCS_ROOT), so the static docs workload is not needed —
# which is what makes this four workloads rather than five.
docs:
  enabled: false

secrets:
  # One secret set, matching all-in-one's hand-enumerated `secretKeys`. The
  # per-service entries must be absent: a secret left behind under a disabled
  # workload is a credential nobody deploys and nobody rotates, and the chart
  # rejects it.
  all-in-one:
    IDENTITY_DATABASE_URL: ref+vault://kv/TODO/identity-backend-v2/small#IDENTITY_DATABASE_URL
    INDEXER_DATABASE_URL: ref+vault://kv/TODO/identity-backend-v2/small#INDEXER_DATABASE_URL
    INVITE_TICKETS_DATABASE_URL: ref+vault://kv/TODO/identity-backend-v2/small#INVITE_DATABASE_URL
    JWT_ED25519_SECRET: ref+vault://kv/TODO/identity-backend-v2/small#JWT_ED25519_SECRET
    POC_HMAC_SECRET: ref+vault://kv/TODO/identity-backend-v2/small#POC_HMAC_SECRET
    TURN_SECRET: ref+vault://kv/TODO/identity-backend-v2/small#TURN_SECRET

  # The workers keep their own sets in both topologies: one signer each, on its
  # own account.
  identity-chain-writer:
    IDENTITY_DATABASE_URL: ref+vault://kv/TODO/identity-backend-v2/small#IDENTITY_DATABASE_URL
    CHAIN_WRITER_SIGNER_SURI: ref+vault://kv/TODO/identity-backend-v2/small#CHAIN_WRITER_SIGNER_SURI
  registration-queue:
    IDENTITY_DATABASE_URL: ref+vault://kv/TODO/identity-backend-v2/small#IDENTITY_DATABASE_URL
  invite-tickets-pool:
    INVITE_TICKETS_DATABASE_URL: ref+vault://kv/TODO/identity-backend-v2/small#INVITE_DATABASE_URL
    INVITER_SIGNER_SURI: ref+vault://kv/TODO/identity-backend-v2/small#INVITE_INVITER_SIGNER_SURI
