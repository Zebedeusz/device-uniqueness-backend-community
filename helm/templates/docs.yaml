{{- $root := . -}}
{{- $d := .Values.docs -}}
{{- if $d.enabled }}
{{/*
The committed API reference, served at /docs — the one route Caddy handles with
a file_server, which has no ingress equivalent. A tiny static server backed by a
ConfigMap keeps the route table complete rather than leaving a hole that only
shows up as a 404 after cutover.

The files come from docs/api-reference/, the SAME committed artifact Caddy
mounts (`just openapi` regenerates them; a test forbids hand-edits). ~214 KB,
comfortably inside a ConfigMap's 1 MiB.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-reference
  labels:
    {{- include "dub.labels" (dict "name" "api-reference" "root" $root) | nindent 4 }}
data:
  index.html: |
{{ $root.Files.Get "files/index.html" | indent 4 }}
  openapi.json: |
{{ $root.Files.Get "files/openapi.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-docs
  labels:
    {{- include "dub.labels" (dict "name" "api-docs" "root" $root) | nindent 4 }}
spec:
  replicas: {{ $d.replicas }}
  selector:
    matchLabels:
      {{- include "dub.selectorLabels" (dict "name" "api-docs" "root" $root) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dub.labels" (dict "name" "api-docs" "root" $root) | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      volumes:
        - name: reference
          configMap:
            name: api-reference
      containers:
        - name: api-docs
          image: {{ $d.image }}
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: reference
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
          resources:
            {{- toYaml $d.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api-docs
  labels:
    {{- include "dub.labels" (dict "name" "api-docs" "root" $root) | nindent 4 }}
spec:
  selector:
    {{- include "dub.selectorLabels" (dict "name" "api-docs" "root" $root) | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
