name: identity-backend-v2

# Local/dev topology: Postgres + the identity binaries, plus the username-indexer
# The People Chain RPC is external (a public Paseo endpoint by default), so
# `docker compose up` needs outbound internet to reach it.
#
# Secrets below use dev-only defaults so `docker compose up` works out of the
# box. Override anything real via a `.env` file next to this compose file (it is
# auto-loaded) or the shell environment. NEVER ship these defaults to prod.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
      POSTGRES_DB: identity
    ports:
      - "${IDENTITY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity"]
      interval: 5s
      timeout: 3s
      retries: 10

  # N-replica HTTP API. Stateless; scale with `--scale identity-api=N`.
  # Applies embedded migrations on boot (advisory-locked, safe across replicas).
  identity-api:
    build: .
    image: ${IDENTITY_IMAGE:-identity-backend-v2:local}
    restart: unless-stopped
    command: ["identity-api"]
    depends_on:
      postgres:
        condition: service_healthy
    # Explicit allowlist: do not inject the shared .env wholesale because it
    # also contains service-owned signing secrets.
    environment:
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://identity:identity@postgres:5432/identity
      PEOPLE_RPC_URL: ${PEOPLE_RPC_URL:-wss://paseo-people-next-system-rpc.polkadot.io}
      # Dev-only 32-byte Ed25519 seed (0x + 64 hex). Replace in prod.
      JWT_ED25519_SECRET: ${JWT_ED25519_SECRET:-0x0101010101010101010101010101010101010101010101010101010101010101}
      # Dev default = //Alice's sr25519 public key (coherent with the writer SURI below).
      ATTESTER_PUBLIC_KEY: ${ATTESTER_PUBLIC_KEY:-0xd43593c715fdd31c61141abd04a99fd6822c8558854ccde39a5684e7a56da27d}
      JWT_ISSUER: ${JWT_ISSUER:-polkadot-app}
      ACCESS_TOKEN_TTL_SECS: ${ACCESS_TOKEN_TTL_SECS:-86400}
      REFRESH_TOKEN_TTL_SECS: ${REFRESH_TOKEN_TTL_SECS:-2592000}
      CHALLENGE_TTL_SECS: ${CHALLENGE_TTL_SECS:-300}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-30}
      AUTH_RATE_WINDOW_SECS: ${AUTH_RATE_WINDOW_SECS:-60}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      ENFORCE_AUTH: ${ENFORCE_AUTH:-false}
      QUEUE_ENABLED: ${QUEUE_ENABLED:-false}
      DOTNS_GATEWAY_ENABLED: ${DOTNS_GATEWAY_ENABLED:-true}
      DOTNS_INTAKE_FRESHNESS_MAX_AGE_SECS: ${DOTNS_INTAKE_FRESHNESS_MAX_AGE_SECS:-600}
      DOTNS_MAX_FUTURE_SKEW_SECS: ${DOTNS_MAX_FUTURE_SKEW_SECS:-600}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      # Covers migrations + the blocking People Chain connect at startup.
      start_period: 40s

  # Single-instance worker: drains the reservation outbox onto People Chain.
  # Reuses the image built by identity-api. MUST stay at exactly one replica —
  # one signer = one nonce lane. Do not `--scale` this service.
  identity-chain-writer:
    image: ${IDENTITY_IMAGE:-identity-backend-v2:local}
    restart: unless-stopped
    command: ["identity-chain-writer"]
    depends_on:
      postgres:
        condition: service_healthy
      identity-api:
        condition: service_started
    # Explicit allowlist: do not inject the shared .env wholesale because it
    # also contains service-owned signing secrets.
    environment:
      DATABASE_URL: postgres://identity:identity@postgres:5432/identity
      PEOPLE_RPC_URL: ${PEOPLE_RPC_URL:-wss://paseo-people-next-system-rpc.polkadot.io}
      # Dev signer. In prod this is the least-privilege proxy key; set
      # CHAIN_WRITER_PROXY_FOR to the cold attester primary it signs for.
      CHAIN_WRITER_SIGNER_SURI: ${CHAIN_WRITER_SIGNER_SURI:-//Alice}
      CHAIN_WRITER_PROXY_FOR: ${CHAIN_WRITER_PROXY_FOR:-}
      CHAIN_WRITER_HOLDER_ID: ${CHAIN_WRITER_HOLDER_ID:-}
      CHAIN_WRITER_LEASE_NAME: ${CHAIN_WRITER_LEASE_NAME:-people-chain-writer}
      CHAIN_WRITER_LEASE_TTL_SECS: ${CHAIN_WRITER_LEASE_TTL_SECS:-30}
      CHAIN_WRITER_POLL_SECS: ${CHAIN_WRITER_POLL_SECS:-2}
      CHAIN_WRITER_BATCH_SIZE: ${CHAIN_WRITER_BATCH_SIZE:-25}
      CHAIN_WRITER_FINALIZE_SECS: ${CHAIN_WRITER_FINALIZE_SECS:-120}
      CHAIN_WRITER_MAX_ATTEMPTS: ${CHAIN_WRITER_MAX_ATTEMPTS:-8}
      QUEUE_FALLBACK_AFTER_SECS: ${QUEUE_FALLBACK_AFTER_SECS:-60}
      RUST_LOG: ${RUST_LOG:-info}
    deploy:
      replicas: 1

  # Registration-queue advancer: the optional-at-runtime queue service. Its
  # Postgres lease is the queue's liveness signal — stop this service and
  # identity-api + identity-chain-writer fall back to the original direct
  # registration path on their own (nothing else depends on it). The lease
  # also guards single-instance promotion; keep it at one replica.
  registration-queue:
    image: ${IDENTITY_IMAGE:-identity-backend-v2:local}
    restart: unless-stopped
    command: ["registration-queue"]
    depends_on:
      postgres:
        condition: service_healthy
    # Explicit allowlist: no signing secrets — this service only reads chain
    # balances and flips queue rows in the identity DB.
    environment:
      DATABASE_URL: postgres://identity:identity@postgres:5432/identity
      PEOPLE_RPC_URL: ${PEOPLE_RPC_URL:-wss://paseo-people-next-system-rpc.polkadot.io}
      QUEUE_ADVANCE_INTERVAL_SECS: ${QUEUE_ADVANCE_INTERVAL_SECS:-6}
      QUEUE_LEASE_TTL_SECS: ${QUEUE_LEASE_TTL_SECS:-30}
      RUST_LOG: ${RUST_LOG:-info}
    deploy:
      replicas: 1

  # username-indexer owns its persistence independently of the identity DB, so its
  # projection can be rebuilt or wiped without touching auth/registration state.
  username-indexer-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: username_indexer
      POSTGRES_PASSWORD: username_indexer
      POSTGRES_DB: username_indexer
    ports:
      - "5433:5432"
    volumes:
      - username_indexer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username_indexer -d username_indexer"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Independent public username-read service. Bootstraps a finalized projection
  # from People Chain, then serves rate-limited search and single-name lookup.
  # Reuses the image built by identity-api. Runs on host port 8081.
  username-indexer:
    build: .
    image: ${IDENTITY_IMAGE:-identity-backend-v2:local}
    restart: unless-stopped
    command: ["username-indexer"]
    depends_on:
      username-indexer-postgres:
        condition: service_healthy
    # Explicit allowlist: do not inject the shared .env wholesale because it
    # also contains service-owned signing secrets.
    environment:
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://username_indexer:username_indexer@username-indexer-postgres:5432/username_indexer
      PEOPLE_RPC_URL: ${PEOPLE_RPC_URL:-wss://paseo-people-next-system-rpc.polkadot.io}
      STORAGE_PAGE_SIZE: ${STORAGE_PAGE_SIZE:-1000}
      SYNC_INTERVAL_SECS: ${SYNC_INTERVAL_SECS:-30}
      SEARCH_RATE_LIMIT: ${SEARCH_RATE_LIMIT:-60}
      SEARCH_RATE_LIMIT_WINDOW_SECS: ${SEARCH_RATE_LIMIT_WINDOW_SECS:-60}
      # Proof-of-compute gate on public search, OFF by default. When enabled the
      # gate is either-or: a valid identity-service JWT satisfies search just as
      # a solved puzzle does, so the shipping apps (which authenticate search)
      # need no change and only anonymous callers mine.
      POC_ENABLED: ${POC_ENABLED:-false}
      POC_HMAC_SECRET: ${POC_HMAC_SECRET:-}
      POC_DIFFICULTY_BITS: ${POC_DIFFICULTY_BITS:-16}
      POC_SESSION_TTL_SECS: ${POC_SESSION_TTL_SECS:-60}
      POC_CLOCK_SKEW_SECS: ${POC_CLOCK_SKEW_SECS:-30}
      # VERIFY-ONLY key material for that bypass — the public half only, never
      # JWT_ED25519_SECRET: this service can verify identity-service tokens but
      # can never mint one (enforced by scripts/verify_compose_boundaries.sh).
      JWT_JWKS_JSON: ${JWT_JWKS_JSON:-}
      JWT_ED25519_PUBLIC_KEY: ${JWT_ED25519_PUBLIC_KEY:-0x8a88e3dd7409f195fd52db2d3cba5d72ca6709bf1d94121bf3748801b40f6f5c}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      # Covers migrations + the finalized bootstrap scan + People Chain connect.
      start_period: 120s

  # dim-tickets owns its persistence independently of the identity DB: the game
  # ticket state machine can be wiped or rebuilt without touching auth state.
  dim-tickets-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DIM_TICKETS_POSTGRES_USER:-dim_tickets}
      POSTGRES_PASSWORD: ${DIM_TICKETS_POSTGRES_PASSWORD:-dim_tickets}
      POSTGRES_DB: ${DIM_TICKETS_POSTGRES_DB:-dim_tickets}
    ports:
      - "127.0.0.1:${DIM_TICKETS_POSTGRES_PORT:-5434}:5432"
    volumes:
      - dim_tickets_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # N-replica HTTP API for the frozen /api/v1/dim-ticket surface. Verify-only:
  # holds the identity JWT PUBLIC key only, never a signing secret. Runs on
  # host port 8082. Applies embedded migrations on boot.
  dim-tickets-api:
    build: .
    image: ${IDENTITY_IMAGE:-identity-backend-v2:local}
    restart: unless-stopped
    command: ["dim-tickets-api"]
    depends_on:
      dim-tickets-postgres:
        condition: service_healthy
    environment:
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://${DIM_TICKETS_POSTGRES_USER:-dim_tickets}:${DIM_TICKETS_POSTGRES_PASSWORD:-dim_tickets}@dim-tickets-postgres:5432/${DIM_TICKETS_POSTGRES_DB:-dim_tickets}
      PEOPLE_RPC_URL: ${PEOPLE_RPC_URL:-wss://paseo-people-next-system-rpc.polkadot.io}
      PEOPLE_NETWORK: ${PEOPLE_NETWORK:-paseo}
      INVITER_ADDRESS: ${INVITER_ADDRESS:-5GrwvaEF5zXb26Fz9rcQpDWS57CtERHpNehXCPcNoHGKutQY}
      # Dev default = the public key of identity-api's dev JWT_ED25519_SECRET,
      # so tokens issued by the local identity-api verify here.
      JWT_JWKS_JSON: ${JWT_JWKS_JSON:-}
      JWT_ED25519_PUBLIC_KEY: ${JWT_ED25519_PUBLIC_KEY:-0x8a88e3dd7409f195fd52db2d3cba5d72ca6709bf1d94121bf3748801b40f6f5c}
      QUOTA_TIMEOUT_SECS: ${QUOTA_TIMEOUT_SECS:-15}
      RATE_LIMIT: ${RATE_LIMIT:-30}
      RATE_LIMIT_WINDOW_SECS: ${RATE_LIMIT_WINDOW_SECS:-60}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      # Covers migrations + the blocking People Chain connect at startup.
      start_period: 40s

  # Single-instance worker: registers pending DIM tickets on People Chain.
  # Reuses the image built above. MUST stay at exactly one replica — one
  # inviter key = one nonce lane. Do not `--scale` this service. The inviter
  # signing secret lives ONLY here: not in dim-tickets-api, not in any
  # identity service.
  dim-tickets-writer:
    image: ${IDENTITY_IMAGE:-identity-backend-v2:local}
    restart: unless-stopped
    command: ["dim-tickets-writer"]
    depends_on:
      dim-tickets-postgres:
        condition: service_healthy
      dim-tickets-api:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${DIM_TICKETS_POSTGRES_USER:-dim_tickets}:${DIM_TICKETS_POSTGRES_PASSWORD:-dim_tickets}@dim-tickets-postgres:5432/${DIM_TICKETS_POSTGRES_DB:-dim_tickets}
      PEOPLE_RPC_URL: ${PEOPLE_RPC_URL:-wss://paseo-people-next-system-rpc.polkadot.io}
      PEOPLE_NETWORK: ${PEOPLE_NETWORK:-paseo}
      INVITER_ADDRESS: ${INVITER_ADDRESS:-5GrwvaEF5zXb26Fz9rcQpDWS57CtERHpNehXCPcNoHGKutQY}
      # Dev signer. In prod this is the hot inviter key (or its proxy); set
      # INVITER_PROXY_FOR to the cold inviter primary it signs for.
      INVITER_SIGNER_SURI: ${INVITER_SIGNER_SURI:-//Alice}
      INVITER_PROXY_FOR: ${INVITER_PROXY_FOR:-}
      WRITER_LEASE_NAME: ${WRITER_LEASE_NAME:-dim-tickets-writer}
      WRITER_LEASE_TTL_SECS: ${WRITER_LEASE_TTL_SECS:-30}
      WRITER_POLL_SECS: ${WRITER_POLL_SECS:-6}
      WRITER_BATCH_SIZE: ${WRITER_BATCH_SIZE:-10}
      WRITER_MAX_RETRIES: ${WRITER_MAX_RETRIES:-5}
      WRITER_RETRY_BASE_MS: ${WRITER_RETRY_BASE_MS:-1000}
      WRITER_RETRY_MAX_MS: ${WRITER_RETRY_MAX_MS:-60000}
      WRITER_RETRY_MAX_EXPONENT: ${WRITER_RETRY_MAX_EXPONENT:-10}
      WRITER_FINALIZE_SECS: ${WRITER_FINALIZE_SECS:-120}
      RUST_LOG: ${RUST_LOG:-info}
    deploy:
      replicas: 1

  # invite-tickets owns its persistence independently: the ticket-pool table
  # holds private keys and must share nothing with the identity DB.
  # Host port 5435 (5434 is dim-tickets').
  invite-tickets-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: invite_tickets
      POSTGRES_PASSWORD: invite_tickets
      POSTGRES_DB: invite_tickets
    ports:
      - "5435:5432"
    volumes:
      - invite_tickets_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invite_tickets -d invite_tickets"]
      interval: 5s
      timeout: 3s
      retries: 10

  # N-replica claim API for the frozen /api/v1/invitation-ticket/claim route.
  # DB-only (never touches the People Chain) and holds no signing secret —
  # explicit environment, no .env pass-through. Host port 8083 (8082 is
  # dim-tickets-api's).
  invite-tickets-api:
    build: .
    image: ${IDENTITY_IMAGE:-identity-backend-v2:local}
    restart: unless-stopped
    command: ["invite-tickets-api"]
    depends_on:
      invite-tickets-postgres:
        condition: service_healthy
    environment:
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://invite_tickets:invite_tickets@invite-tickets-postgres:5432/invite_tickets
      PEOPLE_NETWORK: ${PEOPLE_NETWORK:-paseo}
      # Verifies identity-service JWTs. Dev default = the public half of
      # identity-api's dev JWT_ED25519_SECRET above; in prod prefer
      # JWT_JWKS_JSON from identity-service's /.well-known/jwks.json.
      JWT_JWKS_JSON: ${JWT_JWKS_JSON:-}
      JWT_ED25519_PUBLIC_KEY: ${JWT_ED25519_PUBLIC_KEY:-0x8a88e3dd7409f195fd52db2d3cba5d72ca6709bf1d94121bf3748801b40f6f5c}
      RATE_LIMIT: ${RATE_LIMIT:-30}
      RATE_LIMIT_WINDOW_SECS: ${RATE_LIMIT_WINDOW_SECS:-60}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      # Covers migrations (no chain connect on this bin).
      start_period: 20s

  # Single-instance pool maintainer: registers generated keypairs on People
  # Chain as the inviter. MUST stay at exactly one replica — one inviter = one
  # nonce lane (a Postgres advisory lock guards deploy overlaps). The inviter
  # secret lives only in this service's environment; NOTE it must NOT be the
  # same signing account as dim-tickets-writer (nonce lane conflict — see
  # docs/deploy.md). Do not `--scale` this.
  invite-tickets-pool:
    image: ${IDENTITY_IMAGE:-identity-backend-v2:local}
    restart: unless-stopped
    command: ["invite-tickets-pool"]
    depends_on:
      invite-tickets-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://invite_tickets:invite_tickets@invite-tickets-postgres:5432/invite_tickets
      PEOPLE_RPC_URL: ${PEOPLE_RPC_URL:-wss://paseo-people-next-system-rpc.polkadot.io}
      PEOPLE_NETWORK: ${PEOPLE_NETWORK:-paseo}
      # Dev signer (unfunded: batches finalize with ItemFailed and no tickets
      # insert). In prod: the hot invite-inviter key, or a proxy delegate with
      # …PROXY_FOR set to the cold inviter primary (= …ADDRESS).
      # Interpolated from INVITE_INVITER_* so the invite pool can never share
      # the dim writer's signing account by default (nonce lanes — deploy.md).
      # Dev default = //Bob (dim's writer defaults to //Alice).
      INVITER_ADDRESS: ${INVITE_INVITER_ADDRESS:-5FHneW46xGXgs5mUiveU4sbTyGBzmstUspZC92UhjJM694ty}
      INVITER_SIGNER_SURI: ${INVITE_INVITER_SIGNER_SURI:-//Bob}
      INVITER_PROXY_FOR: ${INVITE_INVITER_PROXY_FOR:-}
      POOL_DIMS: ${POOL_DIMS:-Game,ProofOfInk}
      POOL_TARGET_SIZE: ${POOL_TARGET_SIZE:-10000}
      POOL_BATCH_MAX: ${POOL_BATCH_MAX:-100}
      POOL_INTERVAL_SECS: ${POOL_INTERVAL_SECS:-6}
      POOL_FINALIZE_SECS: ${POOL_FINALIZE_SECS:-60}
      RUST_LOG: ${RUST_LOG:-info}
    deploy:
      replicas: 1

  # TURN credential issuer: stateless (no DB, no chain) — the only secret is
  # the HMAC key shared with the TURN relay (coturn `--use-auth-secret` mode
  # must be configured with the SAME secret and algorithm, or minted
  # credentials will not authenticate). Safe to scale. Host port 8084.
  turn-api:
    build: .
    image: ${IDENTITY_IMAGE:-identity-backend-v2:local}
    restart: unless-stopped
    command: ["turn-api"]
    environment:
      BIND_ADDR: 0.0.0.0:8080
      # Dev secret (base64 of 32×0x42 — the golden-capture secret). In prod
      # this MUST be the relay-shared secret; rotate by restarting relay and
      # issuer together.
      TURN_SECRET: ${TURN_SECRET:-QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=}
      TURN_AUTH_ALGORITHM: ${TURN_AUTH_ALGORITHM:-SHA1}
      TURN_TTL_SECS: ${TURN_TTL_SECS:-1800}
      TURN_REALM: ${TURN_REALM:-example.org}
      ICE_SERVERS: ${ICE_SERVERS:-stun:stun.example.com:3478,turn:turn.example.com:3478?transport=udp}
      # Verifies identity-service JWTs. Dev default = the public half of
      # identity-api's dev JWT_ED25519_SECRET above; in prod prefer
      # JWT_JWKS_JSON from identity-service's /.well-known/jwks.json.
      JWT_JWKS_JSON: ${JWT_JWKS_JSON:-}
      JWT_ED25519_PUBLIC_KEY: ${JWT_ED25519_PUBLIC_KEY:-0x8a88e3dd7409f195fd52db2d3cba5d72ca6709bf1d94121bf3748801b40f6f5c}
      RATE_LIMIT: ${RATE_LIMIT:-30}
      RATE_LIMIT_WINDOW_SECS: ${RATE_LIMIT_WINDOW_SECS:-60}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "8084:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Independent, stateless, DB-free `/api/v1/notify` push relay. No depends_on:
  # stopping it or giving it invalid provider secrets can only fail
  # `/api/v1/notify`. Verify-only: holds the JWT public key, never a signing key.
  # Push secrets are service-owned (from the server's chmod-600 .env); absent
  # providers report per-request failure without affecting readiness. Host port
  # 8085 (8083 is invite-tickets', 8084 is turn's).
  notify-relay:
    build: .
    image: ${IDENTITY_IMAGE:-identity-backend-v2:local}
    restart: unless-stopped
    command: ["notify-relay"]
    environment:
      BIND_ADDR: 0.0.0.0:8080
      # Verifies identity-service JWTs. Dev default = the public half of
      # identity-api's dev JWT_ED25519_SECRET above; in prod prefer JWT_JWKS_JSON.
      JWT_JWKS_JSON: ${JWT_JWKS_JSON:-}
      JWT_ED25519_PUBLIC_KEY: ${JWT_ED25519_PUBLIC_KEY:-0x8a88e3dd7409f195fd52db2d3cba5d72ca6709bf1d94121bf3748801b40f6f5c}
      NOTIFY_RATE_LIMIT: ${NOTIFY_RATE_LIMIT:-60}
      NOTIFY_RATE_LIMIT_WINDOW_SECS: ${NOTIFY_RATE_LIMIT_WINDOW_SECS:-60}
      # APNs: point APNS_KEY_FILE at your .p8 (see the volume); unset -> stub.
      APNS_PRIVATE_KEY_FILE: /run/secrets/notify/apns.p8
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
      APNS_ENVIRONMENT: ${APNS_ENVIRONMENT:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      RUST_LOG: ${RUST_LOG:-info}
    # APNs key, read-only from wherever the operator keeps it. Unset -> /dev/null
    # -> stub. Must exist before deploy, readable by uid 10001; see docs/deploy.md.
    volumes:
      - ${APNS_KEY_FILE:-/dev/null}:/run/secrets/notify/apns.p8:ro
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # The single-URL gateway: the same committed gateway/Caddyfile production's
  # host Caddy installs, here serving plain HTTP on :8000 with upstreams
  # pointed at the compose service names. Holds NO secrets (enforced by
  # scripts/verify_compose_boundaries.sh) — it terminates and routes, nothing
  # else. Per-service host ports (8080–8085) stay published for direct
  # debugging; clients use the gateway.
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      GATEWAY_ADDRESS: ":8000"
      GATEWAY_DOCS_ROOT: /srv/docs
      IDENTITY_UPSTREAM: identity-api:8080
      USERNAME_INDEXER_UPSTREAM: username-indexer:8080
      DIM_TICKETS_UPSTREAM: dim-tickets-api:8080
      INVITE_TICKETS_UPSTREAM: invite-tickets-api:8080
      TURN_UPSTREAM: turn-api:8080
      NOTIFY_UPSTREAM: notify-relay:8080
      # Route-by-route cutover: point at the deployed legacy backend (e.g.
      # https://legacy.example.com) to serve unmigrated routes through this
      # single URL. Default = identity-api, whose 404 stands in for them.
      LEGACY_BACKEND_ORIGIN: ${LEGACY_BACKEND_ORIGIN:-identity-api:8080}
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docs/api-reference:/srv/docs:ro
    ports:
      - "8000:8000"
    depends_on:
      - identity-api
      - username-indexer
      - dim-tickets-api
      - invite-tickets-api
      - turn-api
      - notify-relay

volumes:
  pgdata:
  username_indexer_pgdata:
  dim_tickets_pgdata:
  invite_tickets_pgdata:
