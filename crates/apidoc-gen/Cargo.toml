[package]
name = "apidoc-gen"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Dev-only tool: builds the committed OpenAPI document and the rendered API
# reference from the service crates' `#[utoipa::path]` annotations. Not deployed.
[[bin]]
name = "apidoc-gen"
path = "src/main.rs"

[dependencies]
identity-service = { path = "../identity-service" }
username-indexer = { path = "../username-indexer" }
invite-tickets = { path = "../invite-tickets" }
utoipa.workspace = true
# preserve_order keeps object key order stable across the doc + rendered examples.
serde_json = { version = "1", features = ["preserve_order"] }
anyhow.workspace = true

[lints]
workspace = true
