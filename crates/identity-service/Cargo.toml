[package]
name = "identity-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

# identity-service is a library (shared domain: auth, usernames, outbox) plus two
# deployable binaries: the N-replica `identity-api` and the single-instance
# `identity-chain-writer` that drains the reservation outbox onto People Chain.
[lib]
path = "src/lib.rs"

[[bin]]
name = "identity-api"
path = "src/bin/identity_api.rs"

[[bin]]
name = "identity-chain-writer"
path = "src/bin/identity_chain_writer.rs"

[dependencies]
chain-types.workspace = true
subxt = { workspace = true, features = ["jsonrpsee"] }
subxt-signer = { workspace = true, features = ["subxt"] }

tokio.workspace = true
axum.workspace = true
tower-http = { version = "0.6", features = ["trace", "timeout", "request-id"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "time",
] }
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
time = "0.3"
futures = "0.3"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[lints]
workspace = true
