[package]
name = "identity-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

# identity-service is a library (shared domain: auth, usernames, outbox) plus two
# deployable binaries: the N-replica `identity-api` and the single-instance
# `identity-chain-writer` that drains the reservation outbox onto People Chain.
[lib]
path = "src/lib.rs"

[[bin]]
name = "identity-api"
path = "src/bin/identity_api.rs"

[[bin]]
name = "identity-chain-writer"
path = "src/bin/identity_chain_writer.rs"

[dependencies]
chain-types.workspace = true
chain-client.workspace = true
jwt-verify.workspace = true
http-common.workspace = true
subxt = { workspace = true, features = ["jsonrpsee"] }
subxt-signer = { workspace = true, features = ["subxt"] }

tokio.workspace = true
axum.workspace = true
tower-http = { version = "0.6", features = ["trace", "timeout", "request-id"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
utoipa.workspace = true

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "time",
] }
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
time = "0.3"
futures = "0.3"
# Keep secret config (JWT seed, DB URL, decryption/DeviceCheck keys) out of logs:
# opaque Debug + zeroize-on-drop, exposed only via `.expose_secret()`.
secrecy = "0.10"

# Platform attestation verification (iOS App Attest + Android key attestation):
# CBOR envelope, X.509/ASN.1 parsing, ECDSA P-256/P-384, and RSA (the classic
# Google key-attestation root is RSA).
ciborium = "0.2"
x509-parser = "0.17"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std", "pkcs8", "pem"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
# Android attestation CRL fetch (https://android.googleapis.com/attestation/status).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Play Integrity self-managed keys: the classic token is a JWE (A256KW + A256GCM)
# wrapping a JWS (ES256) verdict, decrypted/verified locally — no Google API call.
aes-gcm = "0.10"
aes-kw = { version = "0.2", features = ["std"] }
# Temporary Google decodeIntegrityToken fallback (until the Play Console
# self-managed key exchange lands): RS256 service-account assertion.
jsonwebtoken = "9"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
subxt-rpcs = { workspace = true, features = ["mock-rpc-client"] }
# Synthetic Apple-style attestation cert chains for App Attest verify tests.
rcgen = "0.13"

[lints]
workspace = true
