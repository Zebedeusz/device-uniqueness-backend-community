name: Release rehearsal

# The release lane publishes the image by digest and joins the per-arch digests
# into one manifest list, and none of that runs until someone pushes a `v*` tag.
# That is how it came to
# be broken for every release without anyone noticing: `--print` looked right,
# and nothing ever pushed.
#
# This rehearses the whole lane against a throwaway local registry. It is NOT on
# every PR — it recompiles the workspace, and `scripts/verify_role_split.sh`
# already asserts the exporter *shape* offline on every push. This catches what
# a shape check cannot: the registry refusing what we actually send it.
on:
  workflow_dispatch:
  schedule:
    # Weekly, so a break is found within days rather than at the next release.
    - cron: "0 6 * * 1"

jobs:
  rehearse:
    # Recompiles the workspace, hence the largest internal runner.
    runs-on: parity-int-ubuntu-xl
    services:
      registry:
        image: registry:2
        ports: ["5000:5000"]
    env:
      IMAGE_REPO: localhost:5000/rehearsal/device-uniqueness-backend
      IMAGE_TAG: 0.0.0-rehearsal
    steps:
      - uses: actions/checkout@v7
      # push-by-digest is unimplemented on the default docker driver; the
      # container driver is what CI's setup-buildx-action provides, and what a
      # laptop reproducing this needs to create by hand.
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          driver-opts: network=host

      - name: Build and push the image by digest
        env:
          PUSH_BY_DIGEST: "true"
        run: docker buildx bake all --metadata-file metadata.json

      - name: Join the digest into a tagged manifest list
        run: |
          target="$(docker buildx bake --print all | jq -r '.group.all.targets[0]')"
          digest="$(jq -r --arg t "$target" '.[$t]["containerimage.digest"]' metadata.json)"
          [ -n "$digest" ] && [ "$digest" != "null" ] ||
            { echo "::error::the build produced no digest"; exit 1; }
          docker buildx imagetools create \
            -t "$IMAGE_REPO:$IMAGE_TAG" -t "$IMAGE_REPO:stable" \
            "$IMAGE_REPO@$digest"

      - name: The registry serves every tag
        run: |
          docker buildx imagetools inspect "$IMAGE_REPO:$IMAGE_TAG" >/dev/null
          docker buildx imagetools inspect "$IMAGE_REPO:stable" >/dev/null
          echo "one image, two tags, both resolvable"

      # The rehearsal's whole point is catching what only shows up once an image
      # exists. Both checks are deterministic — actually STARTING a role would
      # block on its database or chain RPC, and which roles the binary accepts
      # is already compared against compose and the chart by
      # scripts/verify_role_split.sh.
      - name: The published image knows its roles and defaults to none
        run: |
          count="$(docker run --rm "$IMAGE_REPO:$IMAGE_TAG" --list-roles | wc -l)"
          [ "$count" -eq 10 ] ||
            { echo "::error::published image lists $count roles, expected 10"; exit 1; }
          ! docker run --rm "$IMAGE_REPO:$IMAGE_TAG" >/dev/null 2>&1 ||
            { echo "::error::the published image starts with no arguments; it must exit non-zero listing the roles"; exit 1; }
          echo "ten roles listed; an argument-less run fails"
