name: Required checks

on:
  workflow_call:
    inputs:
      ref:
        # A called workflow inherits the CALLER's ref, which is only right when
        # the caller is itself running on the commit under test. The release
        # lane is not: called from release-on-merge.yml it inherits
        # `refs/pull/N/merge` — the pre-merge test-merge commit, which is not
        # what ships and which GitHub deletes once the PR is merged. So the
        # release passes the tag explicitly. Empty means "the caller's ref",
        # which is what deploy.yml wants.
        description: The ref to check out. Defaults to the caller's ref.
        required: false
        type: string

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: compose configuration boundaries
        run: scripts/verify_compose_boundaries.sh
      # One service, one image, one binary. Static (bake --print + compose
      # config), so it belongs in the offline job next to the boundary checks.
      - name: role split
        run: scripts/verify_role_split.sh
      - uses: azure/setup-helm@v4
      # Renders every environment and checks two things against the ARTIFACT:
      # secret boundaries (the Kubernetes form of the compose allowlists) and
      # env-key parity with docker-compose.yml. No cluster involved.
      - name: helm lint
        run: |
          for f in helm/values-*.yaml; do
            helm lint helm -f "$f" --set global.imageTag=lint-only
          done
      - name: helm render boundaries and compose parity
        run: scripts/verify_helm_render.sh
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  # Route parity runs REAL Caddy and REAL Traefik against stub upstreams, so it
  # needs docker and cannot live in the offline job. It replaced a static check
  # that re-implemented both proxies' matching and consequently missed a
  # stripped-prefix bug and every Caddyfile-side edit.
  routes:
    needs: offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: azure/setup-helm@v4
      - name: route parity — every environment
        run: |
          for f in helm/values-*.yaml; do
            echo "=== $f"
            scripts/verify_route_parity_live.sh "$f"
          done

  database:
    needs: offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: Swatinem/rust-cache@v2
      - name: database integration tests
        run: scripts/run_live_suites.sh db cargo test
