name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Always runs on every push and PR — cheap validation, no path gating.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: compose configuration boundaries
        run: scripts/verify_compose_boundaries.sh
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  # Marks a push deployable only when a build/deploy-affecting path changed (an
  # allow-list). Markdown-only pushes (docs, plans, README) match nothing, so
  # build+deploy below are skipped for them.
  changes:
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.filter.outputs.deployable }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            deployable:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.yml'
              - '.env.example'
              - 'justfile'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - '.github/workflows/**'
              - 'docs/api-reference/**'
              - 'gateway/**'

  build:
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # needs build, so a docs-only push (build skipped) skips deploy too, while a
  # real deploy still waits for `check` to pass first.
  deploy:
    needs: [check, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    concurrency:
      group: deploy-ibv2
      cancel-in-progress: false
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.IBV2_SSH_KEY }}
          HOST: ${{ secrets.IBV2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy (pull image + restart)
        env:
          HOST: ${{ secrets.IBV2_HOST }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          ssh ubuntu@"$HOST" "set -euo pipefail
            cd ~/identity-backend-v2
            git fetch origin main
            git reset --hard '$SHA'
            echo '$TOKEN' | sudo docker login ghcr.io -u '$ACTOR' --password-stdin
            sudo docker pull '$IMAGE'
            sudo IDENTITY_IMAGE='$IMAGE' docker compose up -d --wait --no-build
            if ! cmp -s gateway/Caddyfile /etc/caddy/Caddyfile; then
              sudo caddy validate --config gateway/Caddyfile --adapter caddyfile
              sudo cp gateway/Caddyfile /etc/caddy/Caddyfile
              sudo systemctl reload caddy
            fi
            sudo docker logout ghcr.io
            sudo docker image prune -f >/dev/null"

      - name: Public health check
        run: |
          curl -fsS --max-time 20 https://identity.dotspark.app/readyz
          echo
