name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Always runs on every push and PR — offline + deterministic DB suites, with
  # no path gating. Release tags call the same reusable workflow.
  check:
    uses: ./.github/workflows/check.yml

  # Marks a push deployable only when a build/deploy-affecting path changed (an
  # allow-list). Markdown-only pushes (docs, plans, README) match nothing, so
  # build+deploy below are skipped for them.
  changes:
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.filter.outputs.deployable }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            deployable:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Dockerfile'
              - 'docker-bake.hcl'
              - '.dockerignore'
              - 'docker-compose.yml'
              - 'helm/**'
              - 'scripts/**'
              - '.env.example'
              - 'justfile'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - '.github/workflows/**'
              - 'docs/api-reference/**'
              - 'gateway/**'

  build:
    needs: [check, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One bake, ten images: the targets share the Dockerfile's `builder`
      # stage, so the workspace is compiled once. A build matrix would compile
      # it ten times.
      #
      # Registry-backed cache rather than type=gha: bake runs here as a plain
      # command, and the GitHub cache backend needs runtime credentials that
      # are only exported to actions, not to `run:` steps.
      - name: Build and push all ten images
        env:
          IMAGE_REGISTRY: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
          CACHE_FROM: ghcr.io/${{ github.repository }}/buildcache:main
          CACHE_TO: ghcr.io/${{ github.repository }}/buildcache:main
        run: docker buildx bake --push all
      # What was actually published, not what the Dockerfile says: the static
      # check reads source, this pulls each pushed image and looks inside.
      - name: Verify each published image holds exactly one binary
        env:
          IMAGE_REGISTRY: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
          RUNTIME_CHECK: "1"
        run: scripts/verify_image_split.sh

      # `latest` tracks main for the compose/self-host lane, as it did when this
      # was one image. Retagged from the pushed digests — no second build.
      - name: Tag latest
        env:
          IMAGE_REGISTRY: ghcr.io/${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for svc in $(docker buildx bake --print all | jq -r '.group.all.targets[]'); do
            docker buildx imagetools create \
              --tag "$IMAGE_REGISTRY/$svc:latest" \
              "$IMAGE_REGISTRY/$svc:$SHA"
          done

  # needs build, so a docs-only push (build skipped) skips deploy too, while a
  # real deploy still waits for `check` to pass first.
  deploy:
    needs: [check, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    concurrency:
      group: deploy-ibv2
      cancel-in-progress: false
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.IBV2_SSH_KEY }}
          HOST: ${{ secrets.IBV2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy (pull images + restart every environment, then the edge)
        env:
          HOST: ${{ secrets.IBV2_HOST }}
          IMAGE_REGISTRY: ghcr.io/${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          ssh ubuntu@"$HOST" \
            "IMAGE_REGISTRY='$IMAGE_REGISTRY' SHA='$SHA' TOKEN='$TOKEN' ACTOR='$ACTOR' bash -euo pipefail -s" \
            <<'REMOTE'
          # Shared external networks, owned by no project: the edge meets every
          # environment on one, Prometheus scrapes them over the other. Created
          # here as well as in docs/deploy.md so adding a network to compose
          # cannot fail the deploy on an already-running host.
          sudo docker network inspect ibv2-edge >/dev/null 2>&1 ||
            sudo docker network create ibv2-edge
          sudo docker network inspect ibv2-metrics >/dev/null 2>&1 ||
            sudo docker network create ibv2-metrics

          trap 'sudo docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          echo "$TOKEN" | sudo docker login ghcr.io -u "$ACTOR" --password-stdin

          primary="$HOME/identity-backend-v2"
          preview="$HOME/identity-backend-previewnet"

          # Ten images now, all at the same tag. `compose pull` reads the
          # service list out of the compose file, so the set stays right when a
          # service is added — and it pulls the subset PreviewNet actually runs
          # rather than all ten. The images share every layer below the binary,
          # so this is roughly the old single-image transfer plus nine copies of
          # one small layer.
          compose_primary() {
            sudo IMAGE_REGISTRY="$IMAGE_REGISTRY" IMAGE_TAG="$SHA" \
              docker compose -p identity-backend-v2 "$@"
          }
          compose_preview() {
            sudo IMAGE_REGISTRY="$IMAGE_REGISTRY" IMAGE_TAG="$SHA" \
              docker compose -p identity-previewnet "$@"
          }

          # Paseo Next v2 first, so a broken newer environment can neither block
          # nor revert it. `identity-backend-v2` is the project name the running
          # deployment already uses — changing it would orphan its volumes and
          # start a second writer on the same chain.
          # The 420s wait clears the slowest health start_period plus its retries
          # (username-indexer: 300s + 5×10s), so a first boot that is merely slow
          # to bootstrap is not reported as a failed deploy.
          cd "$primary"
          git fetch --no-tags origin main
          git reset --hard "$SHA"
          compose_primary pull --quiet
          compose_primary up -d --wait --wait-timeout 420 --no-build

          # PreviewNet runs a deliberate subset: no dim/invite tickets (they
          # would share the chain-writer's nonce lane on one account and chain)
          # and no turn/notify, which exist once for every environment. Its
          # checkout does not exist until the environment is stood up by hand.
          if [ -d "$preview" ]; then
            cd "$preview"
            git fetch --no-tags "$primary" HEAD
            git reset --hard "$SHA"
            preview_services="postgres identity-api identity-chain-writer
              username-indexer-postgres username-indexer"
            # shellcheck disable=SC2086
            compose_preview pull --quiet $preview_services
            # shellcheck disable=SC2086
            compose_preview up -d --wait --wait-timeout 420 --no-build $preview_services
          else
            echo "skip identity-previewnet — no checkout at $preview"
          fi

          # The edge serves every environment, so it is updated last and only
          # after the one-time cutover from host Caddy (docs/deploy.md); until
          # then CI must not fight the host for 80/443. `validate` runs in a
          # throwaway container so a bad route table cannot reach the running
          # one; `up -d` applies compose changes, then the bind-mounted
          # Caddyfile is reloaded in place rather than recreating the container.
          cd "$primary"
          if sudo docker compose -f gateway/docker-compose.yml -p edge ps -q --all caddy | grep -q .; then
            sudo docker run --rm -v "$PWD/gateway/Caddyfile:/etc/caddy/Caddyfile:ro" \
              caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
            sudo docker compose -f gateway/docker-compose.yml -p edge \
              up -d --wait --wait-timeout 120
            sudo docker compose -f gateway/docker-compose.yml -p edge \
              exec -T caddy caddy reload --config /etc/caddy/Caddyfile
          else
            echo "edge project absent — host Caddy still owns 80/443; skipping"
            echo "run the one-time cutover in docs/deploy.md before it can deploy"
          fi

          # Every deploy pulls a uniquely SHA-tagged image, so dangling-only
          # pruning would grow the disk forever; a week keeps recent tags
          # available for a manual rollback.
          sudo docker image prune -af --filter until=168h >/dev/null
          REMOTE

      # The established hostname is always checked — skipping it on a DNS
      # failure would let a broken deploy report green. Only an environment
      # still being rolled out is skippable.
      - name: Public health check
        run: |
          curl -fsS --max-time 20 https://identity.dotspark.app/readyz
          echo
          host=identity-previewnet.dotspark.app
          if getent hosts "$host" >/dev/null; then
            echo -n "$host → "
            curl -fsS --max-time 20 "https://$host/readyz"
            echo
          else
            echo "skip $host — does not resolve yet"
          fi
