name: Release

# Publishes a release: ten tagged multi-arch images, mirrored to public Docker
# Hub (the ghcr packages inherit this repo's private visibility, so they are not
# pullable without a token), plus per-platform binary tarballs on the GitHub
# Release. Independent of the `main` deploy pipeline in deploy.yml: tagging never
# restarts production, and `latest` keeps tracking `main`.
on:
  # Manual tagging still works exactly as before.
  push:
    tags: ['v*']
  # Called by release-on-merge.yml. A tag pushed with GITHUB_TOKEN does NOT
  # trigger `on: push`, by design — GitHub refuses to let a workflow start
  # another one with the default token. So the merge lane creates the tag and
  # then calls this workflow directly, rather than pushing and hoping.
  workflow_call:
    inputs:
      tag:
        description: The tag to release (e.g. v0.2.0). Defaults to the pushed ref.
        required: false
        type: string

jobs:
  # The tag is passed explicitly: a called workflow inherits the CALLER's ref,
  # so on the merge lane the gate would otherwise run against the PR's
  # test-merge commit rather than the commit being released.
  check:
    uses: ./.github/workflows/check.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  # Fails before the (long) image builds if the tag and the workspace version
  # disagree, so `stable` and the changelog can never point at an image whose
  # binaries report a different version. Releasing is therefore: bump
  # [workspace.package] version + write the changelog entry, merge, then tag.
  version:
    runs-on: parity-int-ubuntu
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      # `refs/tags/`, not the bare name: given `v0.2.0` checkout prefers a
      # BRANCH of that name over the tag, so a stray branch would silently build
      # something other than what the release is labelled with.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - id: check
        run: |
          # One resolution of "which tag is this", used by every job below:
          # `github.ref_name` is the branch, not the tag, when called.
          tag='${{ inputs.tag || github.ref_name }}'
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          manifest=$(grep -m1 -oP '^version = "\K[^"]+' Cargo.toml)
          if [ "$tag" != "v$manifest" ]; then
            echo "::error::tag $tag disagrees with Cargo.toml version $manifest"
            echo "bump [workspace.package] version to ${tag#v}, or retag" >&2
            exit 1
          fi
          echo "version=$manifest" >> "$GITHUB_OUTPUT"

      # A release the changelog does not describe is the failure mode this whole
      # change exists to prevent, so it is a hard gate rather than a warning.
      - name: Require a changelog entry
        run: |
          grep -qF '## [${{ steps.check.outputs.version }}]' CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## [${{ steps.check.outputs.version }}]' section"
            exit 1
          }

  # Builds one architecture per native runner, pushing by digest only (no tags).
  # `manifest` joins the digests into the tagged image. Native runners replace
  # QEMU emulation, which took over an hour for arm64 alone.
  build:
    needs: [check, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: parity-int-ubuntu-xl
            target: x86_64-unknown-linux-gnu
          # GitHub-hosted, deliberately: every Parity self-hosted tray is x86_64,
          # so there is no internal runner to move this leg to. The alternative
          # is QEMU on an amd64 runner, which is what native runners replaced.
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One bake per architecture builds THE image off a single compile of the
      # workspace. Pushed by digest only; `manifest` below joins the two
      # per-arch digests into one tagged manifest list.
      #
      # Per-arch cache ref: one shared ref would have each architecture evict
      # the other's layers on every release. Registry-backed rather than
      # type=gha, because bake runs as a plain command here and the GitHub cache
      # backend's credentials are not exported to `run:` steps.
      - name: Build and push the image by digest
        env:
          IMAGE_REPO: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ needs.version.outputs.version }}
          # Digest mode: bake clears `tags` and names the repo in the exporter.
          # buildkit refuses to push a tagged ref by digest, so this cannot be a
          # `--set "*.output=..."` override — the tags would still be there.
          PUSH_BY_DIGEST: "true"
          CACHE_FROM: ghcr.io/${{ github.repository }}/buildcache:release-${{ matrix.arch }}
          CACHE_TO: ghcr.io/${{ github.repository }}/buildcache:release-${{ matrix.arch }}
        run: |
          docker buildx bake all \
            --set "*.platform=${{ matrix.platform }}" \
            --metadata-file "${{ runner.temp }}/metadata.json"
      # Collapse bake's metadata to the one digest. Keys without a digest are
      # bake's own bookkeeping, not targets.
      - name: Export the digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          jq -r 'to_entries[]
                 | select(.value["containerimage.digest"])
                 | .value["containerimage.digest"]' \
            "${{ runner.temp }}/metadata.json" \
            > "${{ runner.temp }}/digests/${{ matrix.arch }}.txt"
          test "$(wc -l < "${{ runner.temp }}/digests/${{ matrix.arch }}.txt")" -eq 1 ||
            { echo "::error::expected exactly 1 digest"; exit 1; }
      # The `binaries` stage is the same builder layer the images were just built
      # from, so this exports files rather than compiling a second time — and the
      # tarball holds the very binaries that shipped in the images.
      - name: Export the binaries
        run: |
          docker buildx build --target binaries \
            --platform ${{ matrix.platform }} \
            --cache-from "type=registry,ref=ghcr.io/${{ github.repository }}/buildcache:release-${{ matrix.arch }}" \
            --output "type=local,dest=${{ runner.temp }}/bin" .
      - name: Package the binaries
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          name="dub-$VERSION-$TARGET"
          mv "$RUNNER_TEMP/bin" "$RUNNER_TEMP/$name"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: ${{ runner.temp }}/*.tar.gz
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # macOS has no image lane, so it compiles natively — the same single binary
  # the Dockerfile builds. Apple Silicon only: `macos-latest` is arm64.
  # GitHub-hosted, deliberately: `parity-macos` is not in the runner group
  # private repos get by default, and its 6 GB of RAM is thin for a release
  # build. Moving this off GitHub means an SRE request for the tray first.
  macos-binaries:
    needs: [check, version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}
      - uses: Swatinem/rust-cache@v2
      - name: Build the release binary
        run: cargo build --release -p dub
      - name: Package the binaries
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: aarch64-apple-darwin
        run: |
          name="dub-$VERSION-$TARGET"
          mkdir -p "$RUNNER_TEMP/$name"
          # One binary, every service: `dub --role <name>`. The tarball's
          # contents now match the image's, with no list to keep in step.
          cp target/release/dub "$RUNNER_TEMP/$name/"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-aarch64-apple-darwin
          path: ${{ runner.temp }}/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # Joins each service's per-arch digests into its own tagged manifest list, so
  # one tag per service serves both architectures and Docker picks the right one
  # per host. Ten services in, ten manifest lists out — all at the same tags.
  manifest:
    needs: [version, build]
    runs-on: parity-int-ubuntu
    permissions:
      packages: write
    outputs:
      # The repository the release may ADVERTISE, which is not the one it tried
      # to push to: emitted by `pullable` only when the mirror went up and is
      # anonymously pullable. Unset credentials, a rejected push, a private
      # repository — every one of those leaves this empty, and the `release` job
      # falls back to ghcr pull lines. Never point the notes at a registry the
      # reader cannot actually reach.
      public_repo: ${{ steps.pullable.outputs.repo }}
    # No checkout: every step below works out of `${{ runner.temp }}/digests` or
    # against a registry, and `permissions: packages: write` zeroes `contents`,
    # so a checkout could not clone this (private) repository anyway.
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A missing credential skips the public mirror loudly rather than failing
      # the release: ghcr is the lane our own deploys pull from, and it must not
      # be held hostage by a Docker Hub token. The steps below extend that to a
      # credential that is PRESENT but insufficient, and to a repository that is
      # private — every Docker Hub failure is a warning, never a release
      # failure. `secrets` is not available in an `if:`, hence the flag.
      #
      # A plain repository. Docker Hub namespaces are one level (`org/name`),
      # which used to force a `<prefix><service>` hack because ten images could
      # not live under `paritytech/dub/<svc>` the way they did under a ghcr
      # path. One image needs no such workaround.
      - id: dockerhub
        name: Resolve the Docker Hub mirror
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USER }}
          MIRROR: ${{ vars.DOCKERHUB_REPO }}
        run: |
          if [ -z "$USERNAME" ]; then
            echo '::warning::DOCKERHUB_USER is unset — publishing to ghcr only, no public mirror'
            echo 'repo=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "repo=${MIRROR:-docker.io/paritytech/device-uniqueness-backend}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        if: steps.dockerhub.outputs.repo != ''
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      # Tags are computed once, here, rather than via metadata-action: both the
      # ghcr push and the mirror below must tag identically, so deriving them
      # twice would be a drift waiting to happen.
      #
      # Exact version, plus `stable` for consumers who want "newest release"
      # without pinning. No moving major / minor tags, which would jump across
      # breaking changes while pre-1.0. No `latest` — that tag tracks `main`
      # from deploy.yml and must not jump to a release. `stable` is guarded on
      # the tag having no `-`, so a pre-release (v0.2.0-rc1) publishes its exact
      # version without moving `stable` off the last stable image.
      - id: tags
        name: Resolve the release tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          tags="$VERSION v$VERSION"
          case "$TAG" in *-*) ;; *) tags="$tags stable" ;; esac
          echo "list=$tags" >> "$GITHUB_OUTPUT"

      # ghcr FIRST, and alone. This is the lane our own deploys pull from, so it
      # is the half that may fail the release; the Docker Hub mirror below is
      # best-effort by design, and they are separate steps so a Docker Hub
      # credential can never take down a release whose ghcr images published.
      - name: Create and push the manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_REPO: ghcr.io/${{ github.repository }}
          TAGS: ${{ steps.tags.outputs.list }}
        run: |
          args=()
          for tag in $TAGS; do args+=(-t "$IMAGE_REPO:$tag"); done
          for arch_file in *.txt; do
            digest="$(cat "$arch_file")"
            [ -n "$digest" ] || { echo "::error::$arch_file is empty"; exit 1; }
            args+=("$IMAGE_REPO@$digest")
          done
          docker buildx imagetools create "${args[@]}"

      # The same digests, a second registry — and every push guarded, so the
      # step ends in a warning rather than a failure. The mirror is a
      # convenience for outside consumers, and the release notes fall back to
      # ghcr pull lines when it does not happen (see `public_repo` above).
      #
      # `latest` is deliberately absent from `TAGS`: it tracks `main`, and
      # unreleased work is not what an outside consumer should get by default.
      - id: mirror
        name: Mirror the manifest list to Docker Hub
        if: steps.dockerhub.outputs.repo != ''
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_REPO: ghcr.io/${{ github.repository }}
          PUBLIC_REPO: ${{ steps.dockerhub.outputs.repo }}
          TAGS: ${{ steps.tags.outputs.list }}
        run: |
          args=()
          for tag in $TAGS; do args+=(-t "$PUBLIC_REPO:$tag"); done
          # Already validated non-empty by the ghcr step above.
          for arch_file in *.txt; do
            args+=("$IMAGE_REPO@$(cat "$arch_file")")
          done

          if docker buildx imagetools create "${args[@]}"; then
            echo 'mirrored=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'mirrored=false' >> "$GITHUB_OUTPUT"
          echo "::warning::could not mirror to $PUBLIC_REPO — the release will point at ghcr instead. The repository must exist and the DOCKERHUB_PASSWORD token needs write scope on that namespace; see docs/deploy.md."

      # The point of the mirror is an unauthenticated `docker pull`, and a Docker
      # Hub repository can be private without the push saying so. Asked with no
      # credentials at all, so a private repository is caught here rather than on
      # someone else's laptop — and, like a failed push, it downgrades the notes
      # to ghcr rather than failing a release whose images are already published.
      #
      # This step's output IS the job's `public_repo`: it is emitted only on the
      # path where the mirror was pushed AND is anonymously pullable, so every
      # other path leaves it empty and the release falls back to ghcr.
      - id: pullable
        name: Verify the mirror is anonymously pullable
        if: steps.mirror.outputs.mirrored == 'true'
        env:
          PUBLIC_REPO: ${{ steps.dockerhub.outputs.repo }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          repo="${PUBLIC_REPO#docker.io/}"
          # `|| { ...; }`, not a bare assignment: this step runs under `bash -e`,
          # where a failed command substitution aborts the step — turning a
          # network blip into the hard release failure this whole arrangement
          # exists to avoid.
          token=$(curl -fsS "https://auth.docker.io/token?service=registry.docker.io&scope=repository:$repo:pull" | jq -r .token) || {
            echo "::warning::$repo is not anonymously pullable — set the Docker Hub repository to public. The release will point at ghcr instead."
            exit 0
          }
          curl -fsS -o /dev/null \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://registry-1.docker.io/v2/$repo/manifests/$VERSION" || {
            echo "::warning::$repo is not anonymously pullable — set the Docker Hub repository to public. The release will point at ghcr instead."
            exit 0
          }
          echo "the mirror is anonymously pullable"
          echo "repo=$PUBLIC_REPO" >> "$GITHUB_OUTPUT"

      - name: Verify the image has both architectures
        env:
          IMAGE_REPO: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE_REPO:$VERSION" \
            --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}' \
            | tee /dev/stderr | grep -q 'linux/amd64' \
            || { echo "::error::missing linux/amd64"; exit 1; }
          docker buildx imagetools inspect "$IMAGE_REPO:$VERSION" \
            --format '{{range .Manifest.Manifests}}{{.Platform.Architecture}} {{end}}' \
            | grep -q 'arm64' \
            || { echo "::error::missing linux/arm64"; exit 1; }

  # The human-facing half of a release: notes lifted from CHANGELOG.md, plus the
  # compose bundle — the image alone does not say how the services are wired
  # together, and a forked stack needs the gateway and env template to stand up.
  # Runs after `manifest`, so a release never advertises an image that failed to
  # publish.
  release:
    needs: [version, manifest, macos-binaries]
    runs-on: parity-int-ubuntu
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}

      # The binary tarballs the image build exported and the macOS job compiled.
      # Without this they exist only as workflow artifacts, expire in a day, and
      # never reach the Release the notes point people at.
      - uses: actions/download-artifact@v8
        with:
          path: binaries
          pattern: binaries-*
          merge-multiple: true

      - name: Build the release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          # The pull line must name a registry an outside consumer can reach:
          # Docker Hub when the mirror is configured, ghcr (private, token-gated)
          # only as the fallback.
          PUBLIC_REPO: ${{ needs.manifest.outputs.public_repo }}
          GHCR_REPO: ghcr.io/${{ github.repository }}
        run: |
          # The section body for this version: everything between its heading
          # and the next `## `, which is the previous release. Link definitions
          # live at the end of the file, outside every section, so they are
          # appended separately — without them the `[#31]` references in the
          # notes would render as literal text.
          awk -v heading="## [$VERSION]" '
            /^\[[^]]+\]: / { next }
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > section.md
          [ -s section.md ] || {
            echo "::error::the CHANGELOG.md section for $VERSION is empty"
            exit 1
          }
          repo="${PUBLIC_REPO:-$GHCR_REPO}"
          {
            # One image, one tag — the quickstart is the whole stack, and a
            # single service is that same image with a different --role.
            printf '```bash\n'
            printf '# the whole stack, pinned to this release:\n'
            printf 'tar xzf dub-compose-%s.tar.gz && cp .env.example .env\n' "$VERSION"
            printf 'docker network create dub-edge   # once per host\n'
            printf 'docker compose up -d\n\n'
            printf '# ...or one service:\n'
            printf 'docker run %s:%s --role device-attestation-api\n' "$repo" "${{ needs.version.outputs.tag }}"
            printf '```\n'
            printf 'No containers? `dub-%s-<target>.tar.gz` carries the single `dub` binary for `x86_64`/`aarch64` Linux and Apple Silicon — every service is a role of it (`dub --role device-attestation-api`, `dub --list-roles`); `SHA256SUMS` covers every asset here.\n\n' "$VERSION"
            cat section.md
            grep -E '^\[[^]]+\]: ' CHANGELOG.md
          } > notes.md

      # The bundle is the standalone half of a release: it lands on a host with
      # no source tree, so the copy drops the `build:` stanzas (nothing to build
      # from) and pins the image defaults to this release. Both edits are
      # ASSERTED rather than assumed — renaming the local dev defaults in
      # docker-compose.yml should fail the release, not quietly ship a bundle
      # pointing at images nobody else can pull.
      - name: Bundle the compose files
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PUBLIC_REPO: ${{ needs.manifest.outputs.public_repo }}
          GHCR_REPO: ghcr.io/${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          repo="${PUBLIC_REPO:-$GHCR_REPO}"
          mkdir -p bundle/gateway
          # Every service names the same image, so pinning is two substitutions
          # of one variable each. `command: ["--role", ...]` is what still makes
          # each service itself, and it survives the rewrite untouched.
          sed -e '/^    build:$/,+2d' \
              -e "s|\${IMAGE_REPO:-device-uniqueness-backend}|$repo|g" \
              -e "s|\${IMAGE_TAG:-local}|$TAG|g" \
              docker-compose.yml > bundle/docker-compose.yml
          cp .env.example bundle/.env.example
          cp gateway/Caddyfile gateway/docker-compose.yml bundle/gateway/

          if grep -qE '^    build:' bundle/docker-compose.yml; then
            echo '::error::the bundled docker-compose.yml still declares `build:` — it would try to build from a source tree the bundle does not carry'
            exit 1
          fi
          if grep -qE '\$\{IMAGE_(REPO|TAG)' bundle/docker-compose.yml; then
            echo '::error::the bundled docker-compose.yml still has unresolved image variables'
            exit 1
          fi
          test "$(grep -cE "^    image: .*:$TAG\$" bundle/docker-compose.yml)" -eq 8 ||
            { echo "::error::expected eight services pinned to the release image"; exit 1; }
          test "$(grep -cE '^    command: \["--role", ' bundle/docker-compose.yml)" -eq 8 ||
            { echo "::error::the bundle lost a service's --role; every service would start the same way"; exit 1; }
          # The edits above are textual; this proves the result is still a valid
          # compose file rather than something the substitutions mangled.
          docker compose -f bundle/docker-compose.yml config -q

          tar -C bundle -czf "dub-compose-$VERSION.tar.gz" \
            docker-compose.yml .env.example gateway

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # A `-` in the tag (v0.2.0-rc1) is the same pre-release signal the
          # `stable` tag is guarded on, so the two never disagree.
          prerelease=''
          case "$TAG" in *-*) prerelease='--prerelease' ;; esac

          # Every asset in one directory, then one checksum file over all of
          # them — including the compose bundle, so `sha256sum -c` covers the
          # whole release rather than only the binaries.
          mv "dub-compose-$VERSION.tar.gz" binaries/
          ( cd binaries && sha256sum ./*.tar.gz | sed 's| \./| |' > SHA256SUMS )

          # The notes promise three Linux/macOS targets plus the bundle; assert
          # it rather than shipping notes that point at files nobody uploaded.
          test "$(ls binaries/*.tar.gz | wc -l)" -eq 4 ||
            { echo "::error::expected 4 tarballs (3 binary targets + compose bundle), got $(ls binaries/*.tar.gz | wc -l)"; exit 1; }

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md \
            $prerelease \
            binaries/*.tar.gz binaries/SHA256SUMS
